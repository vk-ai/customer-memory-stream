[project]
name = "customer-memory-stream"
version = "0.1.0"
description = "Learning project: Kafka/Redpanda -> per-customer embedding memory -> FastAPI retrieval"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "numpy>=1.26", "kafka-python>=2.0.2", "scikit-learn>=1.4"]
[project.optional-dependencies]
dev = ["pytest>=8", "locust>=2.20"]
neural = ["torch", "transformers"]
[tool.setuptools]
packages = ["cms"]
[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning"]
