name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    services:
      kafka:
        image: apache/kafka:3.9.0
        ports: ["9092:9092"]
    env:
      KAFKA_BOOTSTRAP: localhost:9092
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install -e ".[dev]"
      - name: wait for broker
        run: python -c "import time,socket;[time.sleep(1) for _ in range(60) if socket.socket().connect_ex(('localhost',9092))];print('up')"
      - run: pytest -q -rs
      - name: streaming end-to-end against real Kafka
        run: N_CUSTOMERS=50 python scripts/stream_demo.py
      - name: short load test
        run: bash loadtest/run.sh 10 15
